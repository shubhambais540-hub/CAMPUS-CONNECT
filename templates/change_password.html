<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <h1>Change Password</h1>

        <div class="profile-card">

            <form method="POST"
                  action="{{ url_for('change_password') }}">

                <label>Current Password</label>
                <input type="password"
                       name="current_password"
                       required>

                <label>New Password</label>
                <input type="password"
                       name="new_password"
                       minlength="8"
                       required>

                <label>Confirm New Password</label>
                <input type="password"
                       name="confirm_password"
                       minlength="8"
                       required>

                <button type="submit" class="btn">
                    Change Password
                </button>

            </form>

            <br>

            <a href="{{ url_for('profile') }}" class="btn">
                Back to Profile
            </a>

        </div>
    </div>

</body>
</html>
