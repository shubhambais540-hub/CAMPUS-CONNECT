
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>✏️ Edit Student Profile</h1>

        <div class="profile-card">

            <form action="{{ url_for('update_profile') }}" method="POST">

                <label>Full Name</label>
                <input type="text"
                       name="name"
                       value="{{ user['name'] or '' }}"
                       required>

                <label>Roll Number</label>
                <input type="text"
                       name="roll_no"
                       value="{{ user['roll_no'] or '' }}">

                <label>Gender</label>

                <select name="gender">

                    <option value="">Select Gender</option>

                    <option value="Male"
                    {% if user['gender'] == 'Male' %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                    {% if user['gender'] == 'Female' %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other"
                    {% if user['gender'] == 'Other' %}selected{% endif %}>
                        Other
                    </option>

                </select>

                <label>Branch</label>
                <input type="text"
                       name="branch"
                       value="{{ user['branch'] or '' }}"
                       placeholder="Information Technology">

                <label>Course</label>
                <input type="text"
                       name="course"
                       value="{{ user['course'] or '' }}"
                       placeholder="B.Tech">

                <br><br>

                <button type="submit" class="btn">
                    💾 Save Changes
                </button>

                <a href="{{ url_for('profile') }}" class="btn">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
