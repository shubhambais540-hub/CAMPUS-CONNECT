<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .edit-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .edit-container input,
        .edit-container select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .edit-container label {
            font-weight: bold;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <h1>✏️ Edit Student Details</h1>

        <form method="POST">

            <label>Full Name</label>
            <input type="text" name="name"
                   value="{{ student['name'] or '' }}" required>

            <label>Username</label>
            <input type="text" name="username"
                   value="{{ student['username'] or '' }}">

            <label>Email</label>
            <input type="email" name="email"
                   value="{{ student['email'] or '' }}" required>

            <label>Roll Number</label>
            <input type="text" name="roll_no"
                   value="{{ student['roll_no'] or '' }}">

            <label>Gender</label>
            <select name="gender">
                <option value="">Select Gender</option>
                <option value="Male"
                    {% if student['gender'] == 'Male' %}selected{% endif %}>
                    Male
                </option>
                <option value="Female"
                    {% if student['gender'] == 'Female' %}selected{% endif %}>
                    Female
                </option>
                <option value="Other"
                    {% if student['gender'] == 'Other' %}selected{% endif %}>
                    Other
                </option>
            </select>

            <label>Branch</label>
            <input type="text" name="branch"
                   value="{{ student['branch'] or '' }}">

            <label>Course</label>
            <input type="text" name="course"
                   value="{{ student['course'] or '' }}">

            <button type="submit" class="edit-btn">
                Save Changes
            </button>

        </form>

        <br>

        <a href="{{ url_for('admin_dashboard') }}">
            Back to Admin Dashboard
        </a>

    </div>

</body>
</html>
