
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%,
                #ff8a8a 0%, transparent 35%),

                radial-gradient(circle at 85% 80%,
                #5eead4 0%, transparent 35%),

                linear-gradient(
                    135deg,
                    #312e81,
                    #7c3aed,
                    #2563eb
                );
        }

        /* Main Container */

        .forgot-container {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.96);

            padding: 40px 35px;

            border-radius: 22px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);

            animation: fadeIn 0.7s ease;
        }

        /* Heading */

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            color: #312e81;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Labels */

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 18px;

            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        /* Input Fields */

        input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            background: #f9fafb;

            transition: 0.3s;
        }

        input:focus {
            outline: none;

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.15);

            background: white;
        }

        /* Reset Button */

        button {
            width: 100%;
            margin-top: 28px;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background:
                linear-gradient(135deg, #7c3aed, #2563eb);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(124, 58, 237, 0.3);
        }

        /* Flash Messages */

        .message {
            text-align: center;
            margin: 12px 0;

            color: #2563eb;
            font-size: 14px;
        }

        /* Back to Login */

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #6d28d9;

            text-decoration: none;

            font-weight: bold;
            font-size: 14px;

            transition: 0.3s;
        }

        .back-login a:hover {
            color: #2563eb;
        }

        /* Animation */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */

        @media (max-width: 480px) {

            .forgot-container {
                padding: 30px 22px;
            }

            h2 {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <div class="forgot-container">

        <div class="logo">🔐</div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Don't worry! Enter your registered email
            and create a new password.
        </p>

        <!-- Flash Messages -->

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Password Reset Form -->

        <form method="POST">

            <label for="email">Registered Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <label for="new_password">New Password</label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your new password"
                minlength="8"
                required
            >

            <button type="submit">
                Reset Password →
            </button>

        </form>

        <div class="back-login">
            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>

</html>
